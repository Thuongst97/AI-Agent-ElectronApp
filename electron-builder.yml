appId: com.thuong.ai-agent
productName: AI Agent
copyright: Copyright © 2026 Thuong
directories:
  buildResources: resources
  output: dist

files:
  - out/**/*
  - '!**/*.map'

extraResources:
  - from: data/requirements
    to: requirements
  # Bundle the Copilot CLI binary for packaged builds.
  # In development the globally installed @github/copilot CLI (in PATH) is used.
  # Uncomment and adjust the path once the CLI binary is obtained for each target platform:
  #
  # - from: bin/copilot-win.exe
  #   to: copilot-cli/copilot.exe
  #   filter: ["**/*"]

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AI Agent

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: resources/icon.png
  category: public.app-category.productivity
  darkModeSupport: true

dmg:
  title: AI Agent
  background: null
  window:
    width: 540
    height: 380

linux:
  target: AppImage
  icon: resources/icon.png
  category: Utility

publish:
  provider: github
  releaseType: release
